name: Build — Windows (x64)

on:
  workflow_dispatch: {}   # manual run for testing this platform alone
  workflow_call: {}       # invoked by release.yml on a version tag push

permissions:
  contents: read

jobs:
  build:
    name: Build GUI + dev-assist (windows-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build-*-windows.bat looks for python3.12/python3.11/python3.10/
      # python3/python on PATH via `where` — setup-python's install exposes
      # a plain `python`, which satisfies that final fallback.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Ollama GUI (Ollama-ai-gui.exe + Ollama-ai-manager.exe)
        shell: cmd
        run: builder\build-gui-windows.bat

      - name: Build dev-assist (da.exe + ollama-main.exe)
        shell: cmd
        run: builder\build-da-windows.bat

      - name: List built binaries
        shell: pwsh
        run: |
          Write-Host "── bin\Ollama-GUI\ ──"
          Get-ChildItem -Path bin\Ollama-GUI -ErrorAction SilentlyContinue | Format-Table Name,Length
          Write-Host "── bin\dev-assist\ ──"
          Get-ChildItem -Path bin\dev-assist -ErrorAction SilentlyContinue | Format-Table Name,Length

      - name: Upload Ollama GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-forge-gui-windows-x64
          path: bin/Ollama-GUI/
          if-no-files-found: error

      - name: Upload dev-assist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-forge-dev-assist-windows-x64
          path: bin/dev-assist/
          if-no-files-found: error

name: Build — Linux (AMD64)

on:
  workflow_dispatch: {}   # manual run for testing this platform alone
  workflow_call: {}       # invoked by release.yml on a version tag push

permissions:
  contents: read

jobs:
  build:
    name: Build GUI + dev-assist (linux-amd64)
    runs-on: ubuntu-latest   # GitHub-hosted x86_64 runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PyInstaller needs to import PyQt6 during packaging, which dlopen()s
      # these Qt/xcb runtime libs even on a headless CI box with no display.
      # See: https://doc.qt.io/qt-6/linux-requirements.html
      - name: Install Qt6 runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libxkbcommon-x11-0 libgl1 libegl1 libdbus-1-3

      - name: Verify architecture
        run: |
          echo "uname -m: $(uname -m)"
          [ "$(uname -m)" = "x86_64" ] || { echo "Expected x86_64 runner"; exit 1; }

      - name: Build Ollama GUI (Ollama-ai-gui + Ollama-ai-manager)
        run: bash builder/build-gui-linux-amd64.sh

      - name: Build dev-assist (da + ollama-main)
        run: bash builder/build-da-linux-amd64.sh

      - name: List built binaries
        run: |
          echo "── bin/Ollama-GUI/ ──"
          ls -lh bin/Ollama-GUI/ || true
          echo "── bin/dev-assist/ ──"
          ls -lh bin/dev-assist/ || true

      - name: Upload Ollama GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-forge-gui-linux-amd64
          path: bin/Ollama-GUI/
          if-no-files-found: error

      - name: Upload dev-assist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-forge-dev-assist-linux-amd64
          path: bin/dev-assist/
          if-no-files-found: error
